plugins {
    id 'com.android.application'
}

android {
    namespace 'hnm.horizon.launcher'
    compileSdk 34

    ndkVersion "29.0.14206865" 
    ndkPath "/data/data/com.termux/files/home/android-sdk/ndk/29.0.0" 

    defaultConfig {
        applicationId "hnm.horizon.launcher"
        minSdk 26
        targetSdk 28 // Для обхода ограничений W^X
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // JNA больше не нужен
}